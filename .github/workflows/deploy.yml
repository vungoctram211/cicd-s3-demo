name: Deploy website len S3
on:
push:
branches: [ main ]
jobs:
build-and-deploy:
runs-on: ubuntu-latest
steps:
- name: Lay code tu repository
uses: actions/checkout@v4
- name: Kiem tra file index.html ton tai (buoc Build/Test)
run: |
test -f site/index.html && echo "OK: index.html ton tai"
grep -q "THAY_TEN_BAN" site/index.html && echo "CANH BAO: chua thay ten!" && exit 1 || echo
"OK: da dien thong tin ca nhan"
- name: Cau hinh AWS credentials
uses: aws-actions/configure-aws-credentials@v4
with:
aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
aws-region: ap-southeast-1
- name: Deploy len S3 (buoc Deploy)
run: aws s3 sync site/ s3://cicd-web-vungoctram-2025 --delete